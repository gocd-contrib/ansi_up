name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up NodeJS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .tool-versions
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Fail if generated build output is not committed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Build produced changes that are not committed. Run 'npm run build' and commit the result."
            git status --porcelain
            git --no-pager diff
            exit 1
          fi
